name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: test
        run: go test ./...
      - name: verify curriculum
        run: go run ./cmd/hjkl dev verify
