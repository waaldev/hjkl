id: purple
name: Purple
glyph: "🟣"
rank: 5
title: Power
color: "#7A4E9D"
description: |
  Visual and block mode, registers, macros, :s, ranges.
  The paste-lost-my-yank bug lives here - and so does the fix.
principles: [registers, macros, ex-ranges, operators-over-visual]
challenges:
  - id: purple-01-visual-line
    title: Linewise visual delete
    type: transform
    skills: [visual]
    principle: operators-over-visual
    brief: Delete two lines with V. Prefer 2dd in real life.
    teach: |
      V is linewise Visual. v is characterwise. Ctrl-v is block.

      Visual is great for seeing a range. It is worse for repeating.
      After this taste, prefer operators.
    hint: "V j d"
    start: |
      gone
      gone
      keep
    target: "keep"
    start_cursor: [1, 1]
    par: 3
    solution: "Vjd"

  - id: purple-02-substitute
    title: Substitute on a line
    type: transform
    skills: [substitute]
    principle: ex-ranges
    brief: foo becomes bar on this line.
    teach: |
      :s/foo/bar Enter. Same line only.

      :%s//g whole file. & repeats the last :s. g& repeats globally.
      \v very-magic search is waiting when patterns get noisy.
    hint: ":s/foo/bar Enter"
    start: "foo foo"
    target: "bar foo"
    start_cursor: [1, 1]
    par: 11
    solution: ":s/foo/bar<CR>"

  - id: purple-03-substitute-g
    title: Substitute every match
    type: transform
    skills: [substitute]
    principle: ex-ranges
    brief: Every foo on the line.
    teach: |
      The g flag is "all matches on the line", not "the whole file".
      :%s/foo/bar/g is both: every line, every match.
    hint: ":s/foo/bar/g Enter"
    start: "foo foo foo"
    target: "bar bar bar"
    start_cursor: [1, 1]
    par: 13
    solution: ":s/foo/bar/g<CR>"

  - id: purple-04-yank-register
    title: The yank register
    type: transform
    skills: [registers]
    principle: registers
    brief: Duplicate keep-this after throwing the other line away.
    teach: |
      yy yanks into "0 AND the unnamed register.
      dd overwrites the unnamed register - but "0 still has the yank.

      p pastes unnamed (the delete). "0p pastes the yank.
      This is the "paste lost my yank" bug, and the fix.
    hint: "yy, j, dd, then \"0p"
    start: |
      keep-this
      throw-away
    target: |
      keep-this
      keep-this
    start_cursor: [1, 1]
    par: 8
    solution: "yyjdd\"0p"

  - id: purple-05-black-hole
    title: The black hole
    type: transform
    skills: [registers]
    principle: registers
    brief: Delete junk without clobbering the yank, then paste.
    teach: |
      "_d is delete into the black hole. The unnamed register is untouched.

      "_dd then p still pastes what you yanked earlier.
    hint: "yy, j, \"_dd, then p"
    start: |
      keep-this
      throw-away
    target: |
      keep-this
      keep-this
    start_cursor: [1, 1]
    par: 8
    solution: "yyj\"_ddp"

  - id: purple-06-macro
    title: A tiny macro
    type: transform
    skills: [macros, dot]
    principle: macros
    brief: Prefix each line with - .
    teach: |
      qa starts recording into register a. q stops.

      Normalize: start at a known column (0).
      Strike: use repeatable motions (A, not a count of l).
      Abort: a failed motion stops the macro - that is good.

      @a plays it. 2@a plays it twice. @@ replays the last.
    hint: "qa I- Esc jq, then j@a"
    start: |
      one
      two
    target: |
      - one
      - two
    start_cursor: [1, 1]
    par: 11
    solution: "qaI- <Esc>jqj@a"

  - id: purple-07-block
    title: Block visual
    type: transform
    skills: [visual]
    principle: operators-over-visual
    brief: Insert // at the start of both lines.
    teach: |
      Ctrl-v starts block Visual. I inserts at the start of every
      selected line. Esc commits.

      :'<'>normal I//  is the Ex equivalent - Brown will go there.
    hint: "Ctrl-v j I// Esc"
    start: |
      a = 1
      b = 2
    target: |
      //a = 1
      //b = 2
    start_cursor: [1, 1]
    par: 6
    solution: "<C-v>jI//<Esc>"
    language: go

  - id: purple-08-macro-boss
    title: Boss - normalize, strike, abort
    type: boss
    skills: [macros]
    principle: macros
    brief: Quote every word on the line using a macro, or cgn if you prefer.
    teach: |
      Purple kit: v V Ctrl-v, registers "0 "_, macros, :s.

      A macro: f<space> then i" Esc, or :s/\w\+/"&"/g.

      Editing a macro later: put the register ("ap), edit, yank back.
    hint: ":s/\\w\\+/\"&\"/g Enter"
    start: "alpha bravo"
    target: "\"alpha\" \"bravo\""
    start_cursor: [1, 1]
    par: 14
    solution: ":s/\\w\\+/\"&\"/g<CR>"

  - id: purple-09-ampersand
    title: Repeat a substitute
    type: transform
    skills: [substitute]
    principle: ex-ranges
    brief: Fix the first foo on both lines. Type the pattern once.
    teach: |
      & repeats the last :s on the current line - the . of Ex.
      Act, repeat, reverse: :s acts, & repeats, u reverses.
    hint: "Substitute on line one, move down, then the one-key repeat."
    start: |
      foo foo
      foo foo
    target: |
      bar foo
      bar foo
    start_cursor: [1, 1]
    require: ['&']
    technique: "this drill is about & - repeat the substitute instead of retyping it."
    solution: ":s/foo/bar<CR>j&"

  - id: purple-10-g-ampersand
    title: Repeat a substitute everywhere
    type: transform
    skills: [substitute]
    principle: ex-ranges
    brief: Try the substitute on one line, then apply it to the whole file.
    teach: |
      Practical Vim's workflow: refine :s on one line until it is right,
      then g& replays it across the file with the same flags.
    hint: "One :s on this line, then g followed by the repeat key."
    start: |
      color: red
      color: red
      color: red
    target: |
      colour: red
      colour: red
      colour: red
    start_cursor: [1, 1]
    require: ['g&']
    technique: "this drill is about g& - test on one line, then replay everywhere."
    solution: ":s/color/colour<CR>g&"

  - id: purple-11-append-register
    title: Collect into a register
    type: transform
    skills: [registers]
    principle: registers
    brief: Copy the two keep lines to the end, in order.
    teach: |
      "ayy yanks into register a. "Ayy (capital) appends to it.

      Collect lines from all over a file into one register, then paste
      them in one go.
    hint: "\"ayy on the first, \"Ayy on the second, then \"ap at the end."
    start: |
      keep 1
      skip
      keep 2
    target: |
      keep 1
      skip
      keep 2
      keep 1
      keep 2
    start_cursor: [1, 1]
    require: ['"A']
    technique: "this drill is about \"A - append to a register instead of overwriting it."
    solution: "\"ayyjj\"Ayy\"ap"

  - id: purple-12-ctrl-r
    title: Paste in Insert mode
    type: transform
    skills: [registers]
    principle: registers
    brief: Finish the assignment with the name from line one - without leaving Insert to paste.
    teach: |
      <C-r>{register} pastes a register while you are in Insert mode.
      <C-r>0 is the last yank. Your typing and the paste are one change.
    hint: "Yank the word, go append on line two, then Ctrl-r and the yank register."
    start: |
      gopher
      name := 
    target: |
      gopher
      name := gopher
    start_cursor: [1, 1]
    solution: "yiwjA<C-r>0<Esc>"
    language: go

  - id: purple-13-repeat-ex
    title: Repeat an Ex command
    type: transform
    skills: [substitute, macros]
    principle: ex-ranges
    brief: End every line with a semicolon. Type the command once.
    teach: |
      @: replays the last Ex command. After that, @@ replays it again.
      It is . for the command line.
    hint: ":s/$/;/ on line one, then move and replay the last Ex command."
    start: |
      a := 1
      b := 2
      c := 3
    target: |
      a := 1;
      b := 2;
      c := 3;
    start_cursor: [1, 1]
    require: ['@:']
    technique: "this drill is about @: - replay the Ex command instead of retyping it."
    solution: ":s/$/;/<CR>j@:j@@"
    language: go

  - id: purple-14-visual-increment
    title: Number a list
    type: transform
    skills: [visual]
    principle: operators-over-visual
    brief: Number the list 1, 2, 3.
    teach: |
      <C-a> adds to the number under or after the cursor; <C-x> subtracts.

      In Visual mode, g<C-a> increments progressively: the first line by
      1, the next by 2, and so on. A list of 1s becomes 1, 2, 3.
    hint: "Select lines two to the end with V, then g Ctrl-a."
    start: |
      1. eggs
      1. milk
      1. bread
    target: |
      1. eggs
      2. milk
      3. bread
    start_cursor: [1, 1]
    solution: "jVGg<C-a>"
    language: markdown

  - id: purple-15-parallel-macro
    title: Macro in parallel
    type: boss
    skills: [macros, global]
    principle: macros
    brief: Wrap every word in quotes. Record once, then run it on all the other lines at once.
    teach: |
      Series: 2@q runs the macro again and again, and stops at the first
      failure. Parallel: :2,$normal @q runs it once per line, and one bad
      line does not stop the rest.

      Normalize: start the recording with 0 so every line begins the same.
    hint: "qq 0 i\" Esc A\" Esc q, then :2,$normal @q"
    start: |
      red
      green
      blue
    target: |
      "red"
      "green"
      "blue"
    start_cursor: [1, 1]
    require: ['normal<Space>@q']
    technique: "this drill is about :normal @q - run the macro on every line in parallel."
    solution: "qq0i\"<Esc>A\"<Esc>q:2,$normal @q<CR>"

  - id: purple-16-speedrun-macro
    title: Speedrun - checklist macro
    type: speedrun
    skills: [macros]
    principle: macros
    brief: Turn every line into a checklist item. The clock starts on your first key.
    teach: |
      Record once, play with a count. The macro ends with j so each run
      sets up the next one, and the count can overshoot safely: at the
      last line j fails and the macro aborts.
    hint: "qq, insert the box at the line start, Esc, j, q - then a count and @q."
    start: |
      eggs
      milk
      bread
      tea
      jam
    target: |
      - [ ] eggs
      - [ ] milk
      - [ ] bread
      - [ ] tea
      - [ ] jam
    start_cursor: [1, 1]
    require: ['@q']
    time_target_ms: 10000
    solution: "qqI- [ ] <Esc>jq4@q"
    language: markdown
